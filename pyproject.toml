[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syndrumnet"
version = "1.0.0"
description = "Reproducible implementation of SyndrumNET for synergistic drug combination prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nihad Aslanzade"}
]
keywords = ["drug-combinations", "network-propagation", "systems-biology", "precision-medicine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "mygene>=3.2.0",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/nihadaslanzade-02/SyndrumNET"
Repository = "https://github.com/nihadaslanzade-02/SyndrumNET"
Issues = "https://github.com/nihadaslanzade-02/SyndrumNET/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syndrumnet = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# E4/E7/E9 + F is ruff's default set. F821 (undefined name) is the rule that
# matters most here: every subpackage was once unimportable because typing names
# were used without being imported, and CI now fails on any recurrence.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"